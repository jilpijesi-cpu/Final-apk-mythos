# CI untuk Mythos
name: CI
on:
  push:
    branches:
      - main
      - master
      - 'mythos/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          skip-wrapper-validation: true
      - name: Tes unit
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Bangun APK debug
        run: gradle --no-daemon :app:assembleDebug
      - name: Bangun APK release
        run: gradle --no-daemon :app:assembleRelease
      - name: Unggah APK debug
        uses: actions/upload-artifact@v4
        with:
          name: Mythos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - name: Unggah APK release
        uses: actions/upload-artifact@v4
        with:
          name: Mythos-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
