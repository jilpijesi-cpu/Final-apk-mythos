# Dipicu oleh tool build_apk di aplikasi (git push). Artifact 'mythos-debug' diunduh balik oleh skrip tools/build-github.sh.
name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

# Run lama hanya dibatalkan untuk pull request. Untuk push TIDAK: tool build_apk menunggu run milik commit-nya sendiri,
# dan pembatalan oleh push berikutnya akan tampak sebagai build gagal.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Token bawaan hanya boleh membaca isi repo (rahasia keystore tetap dipakai lewat secrets).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Pastikan gradle-wrapper.jar cocok dengan checksum resmi Gradle (F-08).
      - name: Validasi Gradle Wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # Verifikasi checksum berangkas bila proyek ini membawanya (AUD-13).
      - name: Verifikasi SHA256SUMS berangkas
        run: |
          set -euo pipefail
          if [ -f app/src/main/assets/berangkas/SHA256SUMS ]; then
            (cd app/src/main/assets/berangkas && sha256sum -c SHA256SUMS)
          fi

      - name: Siapkan JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Siapkan Gradle 8.9
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.9'

      # Identitas penandatangan: bila rahasia ada, build ditandatangani keystore yang sama dengan di HP,
      # sehingga APK dari sini bisa menimpa APK dari Termux (dan sebaliknya).
      - name: Siapkan keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          EXPECTED_SHA256_SECRET: ${{ secrets.KEYSTORE_SHA256 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ]; then
            umask 077
            printf '%s' "$KEYSTORE_B64" | base64 --decode > kita.jks
            test -s kita.jks
            chmod 600 kita.jks
            KEY_ALIAS="${KEY_ALIAS_SECRET:-kita}"
            ACTUAL_SHA256="$(keytool -list -v -keystore kita.jks -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}')"
            if [ -z "$ACTUAL_SHA256" ]; then
              echo "::error::Tidak dapat membaca sertifikat untuk alias '$KEY_ALIAS' dari keystore."
              exit 1
            fi
            if [ -n "${EXPECTED_SHA256_SECRET:-}" ] && [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256_SECRET" ]; then
              echo "::error::Fingerprint keystore tidak cocok dengan secret KEYSTORE_SHA256."
              exit 1
            fi
            keytool -certreq -alias "$KEY_ALIAS" -keystore kita.jks -storepass:env KEYSTORE_PASSWORD -keypass:env KEYSTORE_PASSWORD -file /dev/null >/dev/null 2>&1
            printf 'storeFile=kita.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEYSTORE_PASSWORD" > keystore.properties
            chmod 600 keystore.properties
            echo "Keystore valid dan dipasang (alias: $KEY_ALIAS)."
          else
            echo "Rahasia keystore tidak ada: APK memakai kunci debug bawaan (tidak bisa menimpa APK dari HP)."
            echo "GRADLE_EXTRA=-PallowUnsigned=true" >> "$GITHUB_ENV"
          fi

      # APK dibangun dan diunggah DULU supaya hasilnya tetap ada walau ada tes yang gagal; tes dijalankan sesudahnya
      # dan kegagalannya tetap membuat job merah.
      - name: Build APK debug
        env:
          PR_EXTRA: ${{ github.event_name == 'pull_request' && '-PallowUnsigned=true' || '' }}
        run: ./gradlew assembleDebug --no-daemon ${GRADLE_EXTRA:-} ${PR_EXTRA:-}

      # Pastikan source bundle di dalam APK (bila ada) bebas rahasia (F-03).
      - name: Periksa source bundle APK
        run: |
          set -euo pipefail
          if [ -f tools/cek-source-bundle.sh ]; then
            APK="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
            bash tools/cek-source-bundle.sh "$APK"
          fi

      - name: Hapus material penandatanganan
        if: always()
        run: rm -f kita.jks keystore.properties

      - name: Unggah APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mythos-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Jalankan tes unit
        run: ./gradlew testDebugUnitTest --no-daemon ${GRADLE_EXTRA:-}

      # Laporan tes selalu diunggah (juga saat gagal) agar penyebab bisa dibaca tanpa mengulang build.
      - name: Unggah laporan tes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: laporan-tes-unit
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      # Lint tidak menggagalkan job (belum ada baseline); hasilnya dipakai untuk membersihkan temuan bertahap.
      - name: Jalankan lint
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon ${GRADLE_EXTRA:-}

      - name: Unggah laporan lint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: laporan-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
